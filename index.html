<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CourtReady">
<title>CourtReady</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--court:#2D6A4F;--courtl:#40916C;--cline:#74C69D;--acc:#F4A261;--hot:#E76F51;--ball:#D4E157;--bg:#0D1117;--bg2:#161B22;--sur:#21262D;--sur2:#2D333B;--brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.15);--txt:#E6EDF3;--txt2:#8B949E;--txt3:#6E7681;--red:#FF6B6B;--pur:#A78BFA;--r:8px;--rl:14px;--nav:64px;--hdr:52px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Barlow",sans-serif;color:var(--txt)}
#root{height:100%;display:flex;flex-direction:column}
button{font-family:"Barlow",sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:"Barlow",sans-serif;outline:none}
.app{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative}
.hdr{height:var(--hdr);background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:50}
.hdr-title{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--cline)}
.hdr-title span{color:var(--acc)}
.hdr-right{display:flex;align-items:center;gap:8px}
.rchip{display:flex;align-items:center;gap:5px;background:var(--sur);border:1px solid var(--brd);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;font-family:"Barlow Condensed",sans-serif;letter-spacing:.05em}
.rdot{width:7px;height:7px;border-radius:50%;background:var(--txt3)}
.rdot.g{background:var(--cline)}.rdot.a{background:var(--acc)}.rdot.r{background:var(--red)}
.gear{background:transparent;color:var(--txt3);font-size:20px;padding:4px;border-radius:6px}
.tabs{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + 8px)}
.tabs::-webkit-scrollbar{width:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:2px}
.bnav{height:var(--nav);background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-top:1px solid var(--brd);display:flex;align-items:center;flex-shrink:0}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;color:var(--txt3);padding:8px 0;transition:color .15s}
.bnav-btn.on{color:var(--cline)}
.bnav-icon{font-size:20px;line-height:1}
.bnav-lbl{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif}
.pg{padding:16px}
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.sh:first-child{margin-top:0}
.st{font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cline);white-space:nowrap}
.sl{height:1px;flex:1;background:linear-gradient(90deg,var(--court),transparent)}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--brd);font-size:13px}
.row:last-child{border-bottom:none}
.rn{color:var(--txt)}.rv{color:var(--txt3);font-size:12px;text-align:right}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase;margin-left:5px;vertical-align:middle}
.tg{background:rgba(116,198,157,.15);color:var(--cline)}.tp{background:rgba(167,139,250,.15);color:var(--pur)}.ta{background:rgba(244,162,97,.15);color:var(--acc)}.tr{background:rgba(255,107,107,.15);color:var(--red)}.tm{background:rgba(212,225,87,.15);color:var(--ball)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:600;font-family:"Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;transition:all .15s}
.btn-p{background:var(--court);color:#fff}.btn-p:hover{background:var(--courtl)}
.btn-o{background:transparent;border:1px solid var(--brd2);color:var(--txt2)}.btn-o:hover{border-color:var(--cline);color:var(--cline)}
.btn-sm{padding:6px 14px;font-size:12px}.btn-w{width:100%}
.snav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.snbtn{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:20px;border:1px solid var(--brd2);background:transparent;color:var(--txt2);cursor:pointer;transition:all .15s}
.snbtn.on{background:var(--court);border-color:var(--court);color:#fff}
.info{border-radius:var(--r);padding:10px 14px;font-size:13px;line-height:1.6;margin-bottom:10px}
.ig{background:rgba(64,145,108,.12);color:var(--cline);border-left:3px solid var(--court);border-radius:0 var(--r) var(--r) 0}
.io{background:rgba(244,162,97,.1);color:var(--acc);border-left:3px solid var(--acc);border-radius:0 var(--r) var(--r) 0}
.ir{background:rgba(255,107,107,.1);color:var(--red);border-left:3px solid var(--red);border-radius:0 var(--r) var(--r) 0}
.vwrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);background:var(--bg2);margin:10px 0}
.vwrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:var(--r)}
.vthumb{position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vthumb img{width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.vplay{position:absolute;width:52px;height:52px;background:rgba(0,0,0,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid rgba(255,255,255,.5)}
.drill{border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;margin-bottom:8px;transition:border-color .15s}

.dhdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
.dhdr:hover{background:var(--sur2)}
.dtitle{font-size:14px;font-weight:600;color:var(--txt)}
.dmeta{font-size:11px;color:var(--txt3);margin-top:2px}
.dchev{color:var(--txt3);font-size:16px;transition:transform .2s;flex-shrink:0;margin-left:10px}
.drill.open .dchev{transform:rotate(180deg)}
.dbody{border-top:1px solid var(--brd);padding:14px;display:none;background:var(--bg2)}
.drill.open .dbody{display:block}
.step{display:flex;gap:10px;margin-bottom:8px;font-size:13px}
.sn{min-width:20px;height:20px;border-radius:50%;background:var(--court);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.st2{color:var(--txt2);line-height:1.5}
.dtip{background:rgba(45,106,79,.15);border-left:3px solid var(--court);border-radius:0 6px 6px 0;padding:9px 12px;font-size:12px;color:var(--cline);line-height:1.5;margin-top:8px}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:32px}
.llogo{font-family:"Barlow Condensed",sans-serif;font-size:48px;font-weight:900;text-transform:uppercase;color:var(--cline);margin-bottom:6px}
.llogo span{color:var(--acc)}
.lsub{font-size:13px;color:var(--txt3);margin-bottom:40px}
.pdots{display:flex;gap:12px;margin-bottom:24px}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brd2);transition:all .15s}
.pdot.f{background:var(--cline);border-color:var(--cline)}
.ppad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px}
.pkey{height:60px;border-radius:var(--rl);background:var(--sur);border:1px solid var(--brd);color:var(--txt);font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pkey:hover{background:var(--sur2);border-color:var(--court)}
.pkey:active{background:var(--court);color:#fff}
.pkey.z{grid-column:2}.pkey.del{background:transparent;border:none;color:var(--txt3);font-size:16px}
.bbtn{margin-top:16px;background:transparent;border:1px solid var(--brd2);color:var(--cline);padding:10px 24px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.lerr{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}
.wcard{background:linear-gradient(135deg,var(--court) 0%,#1a3d2e 100%);border:1px solid rgba(116,198,157,.2);border-radius:var(--rl);padding:16px;margin-bottom:12px}

.tblk{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px;margin-bottom:12px}

.sgv{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:900;color:var(--cline)}
.sgl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.wnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wnbtn{background:var(--sur);border:1px solid var(--brd);color:var(--txt2);border-radius:var(--r);padding:7px 14px;font-size:13px;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.05em}
.wlbl{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:900;color:var(--txt);text-transform:uppercase;letter-spacing:.05em}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dcell{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:8px 3px;text-align:center;cursor:pointer;transition:all .15s;min-height:72px;display:flex;flex-direction:column;align-items:center;gap:3px}

.dnm{font-size:9px;font-weight:700;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase}
.dbl{font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;color:var(--txt2);text-align:center;line-height:1.2;margin-top:2px}
.ddn{font-size:18px;color:var(--cline)}
.bpick{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px;margin-bottom:12px}
.bpd{font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:700;color:var(--txt);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.bpg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bpo{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:8px 10px;cursor:pointer;transition:all .15s;text-align:left}
.bpo:hover{border-color:var(--brd2)}.bpo.sel{border-color:var(--court);background:rgba(45,106,79,.12)}
.bpl{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:900;margin-bottom:1px}
.bpn{font-size:11px;color:var(--txt2);line-height:1.3}
.rlst{display:flex;flex-direction:column;gap:6px}
.ritem{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.rnum{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:900;color:var(--court);line-height:1;min-width:26px}
.rtxt{font-size:12px;color:var(--txt2);line-height:1.5}
.rtxt strong{color:var(--txt);font-weight:600}
.lform{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px;margin-bottom:14px}
.lrow{margin-bottom:10px}
.llbl{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.linp{width:100%;background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt);padding:8px 12px;font-size:13px}
.linp:focus{border-color:var(--cline)}
.lsel{width:100%;background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt);padding:8px 12px;font-size:13px;appearance:none}
.ltxt{width:100%;background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt);padding:8px 12px;font-size:13px;min-height:70px;resize:none}
.ltxt:focus{border-color:var(--cline)}
.rrow{display:flex;gap:6px}
.rbtn{flex:1;height:36px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--brd);color:var(--txt3);font-size:16px;cursor:pointer;transition:all .15s}
.rbtn.sel{background:var(--court);border-color:var(--court);color:#fff}
.si{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:12px 14px;margin-bottom:8px}
.sih{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sib{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:700;color:var(--txt)}
.sin{font-size:12px;color:var(--txt2);margin-top:4px;line-height:1.4}
.sim{display:flex;gap:8px;margin-top:6px}
.sic{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg2);color:var(--txt3);font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.05em}
.ssel{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.wkbtn{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:6px;border:1px solid var(--brd);background:var(--sur);color:var(--txt2);cursor:pointer;transition:all .15s}
.wkbtn.on{background:var(--court);border-color:var(--court);color:#fff}
.wpd{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:10px 12px;margin-bottom:6px}

.dtl{background:rgba(244,162,97,.15);color:var(--acc)}.dtu{background:rgba(167,139,250,.15);color:var(--pur)}.dth{background:rgba(116,198,157,.15);color:var(--cline)}.dti{background:rgba(255,107,107,.15);color:var(--red)}

.ps{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}

.kme{background:rgba(244,162,97,.15);color:var(--acc);font-family:"Barlow Condensed",sans-serif;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.05em}
.sc-calc{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px;margin-bottom:12px}

// PKCE
async function b64u(arr){return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
async function genVerifier(){const a=new Uint8Array(32);crypto.getRandomValues(a);return b64u(a);}
async function genChallenge(v){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return b64u(new Uint8Array(h));}
async function sha256(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}

async function initiateWhoopAuth(){
  const ver=await genVerifier();
  const ch=await genChallenge(ver);
  const st=btoa(Math.random().toString());
  localStorage.setItem('whoop_ver',ver);
  localStorage.setItem('whoop_st',st);
  const p=new URLSearchParams({client_id:WHOOP.clientId,redirect_uri:WHOOP.redirectUri,response_type:'code',scope:WHOOP.scopes,code_challenge:ch,code_challenge_method:'S256',state:st});
  window.location.href=WHOOP.authUrl+'?'+p;
}

async function exchangeCode(code){
  const ver=localStorage.getItem('whoop_ver');
  if(!ver)throw new Error('Verifier missing - please try again.');
  localStorage.removeItem('whoop_ver');localStorage.removeItem('whoop_st');
  const res=await fetch(WHOOP.tokenProxy,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'authorization_code',client_id:WHOOP.clientId,code,redirect_uri:WHOOP.redirectUri,code_verifier:ver})});
  if(!res.ok){const t=await res.text();throw new Error('Exchange failed ('+res.status+'): '+t);}
  return res.json();
}

async function proxyGet(path,token){
  const url=WHOOP.apiProxy+'?path='+encodeURIComponent(path);
  const res=await fetch(url,{headers:{Authorization:'Bearer '+token}});
  if(!res.ok){dbg('[W] GET failed',res.status,path);return null;}
  return res.json();
}

async function fetchWhoop(token){
  try{
    dbg('[W] Fetching...');
    const rec=await proxyGet('/developer/v2/recovery?limit=1',token);
    const cyc=await proxyGet('/developer/v2/cycle?limit=1',token);
    const rr=rec&&rec.records&&rec.records.find(r=>r.score_state==='SCORED');
    const cr=cyc&&cyc.records&&cyc.records[0];
    let slpScore=null;
    if(rr&&rr.cycle_id){
      const slp=await proxyGet('/developer/v2/cycle/'+rr.cycle_id+'/sleep',token);
      if(slp&&slp.score)slpScore=slp.score.sleep_performance_percentage;
    }
    const result={recovery:rr&&rr.score&&rr.score.recovery_score,sleep:slpScore,strain:cr&&cr.score&&cr.score.strain,hrv:rr&&rr.score&&rr.score.hrv_rmssd_milli&&rr.score.hrv_rmssd_milli.toFixed(0),rhr:rr&&rr.score&&rr.score.resting_heart_rate};
    dbg('[W] Result:',result);
    return result;
  }catch(e){dbg('[W] Error:',e.message);return null;}
}

function WorkoutLogger({block,onClose}){
  const exs=(block==='B'?GYM_B:GYM_C).flatMap(s=>s.exs);
  const[sets,setSets]=useState(()=>{const o={};exs.forEach(e=>{o[e.name]=[];});return o;});
  const[prFlash,setPrFlash]=useState('');
  const prs=ls('cr_prs',{});
  const hist=ls('cr_wlog',[]);
  const last=hist.find(s=>s.block===block);
  function getLastSets(n){if(!last)return null;const e=last.exs&&last.exs.find(e=>e.name===n);return e&&e.sets||null;}
  function getPR(n){return prs[n]||null;}
  function addSet(n){setSets(p=>({...p,[n]:[...p[n],{w:'',r:''}]}));}
  function upd(n,i,f,v){setSets(p=>({...p,[n]:p[n].map((s,j)=>j===i?{...s,[f]:v}:s)}));}
  function del(n,i){setSets(p=>({...p,[n]:p[n].filter((_,j)=>j!==i)}));}
  function isPR(n,w,r){const pr=prs[n];if(!w||!r)return false;const ww=parseFloat(w),rr=parseInt(r);if(!pr)return true;return ww>pr.w||(ww===pr.w&&rr>pr.r);}
  function finish(){
    const np={...prs};let prc=0;const saved=[];
    Object.entries(sets).forEach(([n,ss])=>{
      const done=ss.filter(s=>s.w&&s.r);if(!done.length)return;
      saved.push({name:n,sets:done});
      done.forEach(s=>{const w=parseFloat(s.w),r=parseInt(s.r);const pr=np[n];if(!pr||w>pr.w||(w===pr.w&&r>pr.r)){np[n]={w,r,date:today()};prc++;}});
    });
    lss('cr_prs',np);
    lss('cr_wlog',[{id:Date.now(),date:today(),week:startWeek(),block,exs:saved},...hist]);
    const all=ls('cr_sessions',[]);
    lss('cr_sessions',[{id:Date.now()+1,date:today(),week:startWeek(),block,exercise:'Block '+block+' workout',source:'train',dur:block==='B'?'50':'40',notes:saved.length+' exercises'+(prc>0?' · '+prc+' new PR'+(prc>1?'s':'')+'!':''),rating:0},...all]);
    if(prc>0){setPrFlash(prc+' new PR'+(prc>1?'s':'')+'! 🏆');setTimeout(()=>{setPrFlash('');onClose();},2000);}else{onClose();}
  }
  const total=Object.values(sets).flat().filter(s=>s.w&&s.r).length;
  return(
    <div className="wlo">
      {prFlash&&<div className="prfl">{prFlash}</div>}
      <div className="wlh">
        <div><div className="wlt">Block {block} · {block==='B'?'Lower body':'Upper body'}</div><div style={{fontSize:11,color:'var(--txt3)',marginTop:2}}>{today()} · {total} sets</div></div>
        <button className="btn btn-o btn-sm" onClick={onClose}>x Close</button>
      </div>
      <div className="wlb">
        {exs.map((ex,ei)=>{
          const pr=getPR(ex.name);const ls2=getLastSets(ex.name);const es=sets[ex.name]||[];
          return(
            <div className="exc" key={ei}>
              <div className="exn">{ex.name}{pr&&<span className="prb">PR {pr.w}kg x {pr.r}</span>}</div>
              {ls2&&ls2.length>0&&<div className="exp">Last: {ls2.map(s=>s.w+'kg x '+s.r).join(' · ')}</div>}
              {es.length>0&&<><div className="seth"><span>#</span><span>KG</span><span>REPS</span><span/></div>
              {es.map((s,si)=>{
                const ip=isPR(ex.name,s.w,s.r);
                return(<div className="setr" key={si}>
                  <div className="setn">{si+1}</div>
                  <input className={'seti'+(ip?' pr':'')} type="number" placeholder="0" value={s.w} onChange={e=>upd(ex.name,si,'w',e.target.value)} min="0" step="0.5"/>
                  <input className={'seti'+(ip?' pr':'')} type="number" placeholder="0" value={s.r} onChange={e=>upd(ex.name,si,'r',e.target.value)} min="0"/>
                  <button className="setd" onClick={()=>del(ex.name,si)}>x</button>
                </div>);
              })}</>}
              <button className="addset" onClick={()=>addSet(ex.name)}>+ Add set{ls2&&ls2.length>0&&es.length===0?' (copy last)':''}</button>
            </div>
          );
        })}
        {last&&<div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:11,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:'.1em',margin:'16px 0 8px'}}>Previous · {last.date}</div>}
      </div>
      <div className="wlf"><button className="btn btn-p btn-w" style={{fontSize:15}} onClick={finish}>Finish workout · {total} sets</button></div>
    </div>
  );
}

// ── LOCK SCREEN ──────────────────────────────────────────────────────────
function LockScreen({onUnlock}){
  const[pin,setPin]=useState('');
  const[mode,setMode]=useState('init');
  const[err,setErr]=useState('');
  const hasCred=ls('cr_has_pin',false);const hasBio=ls('cr_has_bio',false);
  useEffect(()=>{
    if(hasBio){setMode('bio');tryBio();}
    else if(hasCred){setMode('auth');}
    else{setMode('choose');}
  },[]);
  async function tryBio(){
    try{
      const cid=ls('cr_bio_id',null);if(!cid){setMode(hasCred?'auth':'choose');return;}
      const ch=new Uint8Array(32);crypto.getRandomValues(ch);
      await navigator.credentials.get({publicKey:{challenge:ch,rpId:RP_ID,allowCredentials:[{id:Uint8Array.from(atob(cid),c=>c.charCodeAt(0)),type:'public-key'}],userVerification:'required',timeout:60000}});
      onUnlock();
    }catch(e){setMode(hasCred?'auth':'choose');setErr('Biometric failed - enter PIN');}
  }
  async function setupBio(){
    try{
      const ch=new Uint8Array(32);crypto.getRandomValues(ch);
      const cred=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'CourtReady',id:RP_ID},user:{id:new TextEncoder().encode('cr-user'),name:'CourtReady User',displayName:'CourtReady User'},pubKeyCredParams:[{alg:-7,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
      lss('cr_bio_id',btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
      lss('cr_has_bio',true);onUnlock();
    }catch(e){setErr('Biometric failed');setMode('choose');}
  }
  async function handlePin(d){
    const np=pin+d;setPin(np);setErr('');
    if(np.length<4)return;
    const h=await sha256(np);
    if(mode==='setup'){lss('cr_pin_hash',h);lss('cr_has_pin',true);setPin('');onUnlock();}
    else{if(h===ls('cr_pin_hash','')){setPin('');onUnlock();}else{setPin('');setErr('Wrong PIN');}}
  }
  return(
    <div className="lock">
      <div className="llogo">Court<span>Ready</span></div>
      <div className="lsub">Your training, your data.</div>
      {mode==='choose'&&(
        <div style={{display:'flex',flexDirection:'column',gap:10,width:240}}>
          {window.PublicKeyCredential&&<button className="btn btn-p btn-w" onClick={setupBio}>Use Fingerprint</button>}
          <button className="btn btn-o btn-w" onClick={()=>setMode('setup')}>Set up PIN</button>
          <button className="btn btn-o btn-w" style={{color:'var(--txt3)'}} onClick={onUnlock}>Skip</button>
        </div>
      )}
      {(mode==='auth'||mode==='setup')&&(
        <>
          <p style={{fontSize:13,color:'var(--txt2)',marginBottom:20}}>{mode==='setup'?'Choose a 4-digit PIN':'Enter your PIN'}</p>
          <div className="pdots">{[0,1,2,3].map(i=><div key={i} className={'pdot'+(pin.length>i?' f':'')}/>)}</div>
          <div className="ppad">
            {['1','2','3','4','5','6','7','8','9'].map(k=><button key={k} className="pkey" onClick={()=>handlePin(k)}>{k}</button>)}
            <button className="pkey z" onClick={()=>handlePin('0')}>0</button>
            <button className="pkey del" onClick={()=>{setPin(p=>p.slice(0,-1));setErr('');}}>back</button>
          </div>
          {hasBio&&mode==='auth'&&<button className="bbtn" onClick={()=>{setMode('bio');tryBio();}}>Use fingerprint</button>}
        </>
      )}
      {mode==='bio'&&<><p style={{fontSize:13,color:'var(--txt2)',marginBottom:20}}>Verifying...</p><button className="bbtn" onClick={()=>setMode(hasCred?'auth':'choose')}>Use PIN instead</button></>}
      <div className="lerr">{err}</div>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────
function App(){
  const[locked,setLocked]=useState(()=>ls('cr_has_pin',false)||ls('cr_has_bio',false));
  const[setupLock,setSetupLock]=useState(false);
  const[tab,setTab]=useState('home');
  const[showSettings,setShowSettings]=useState(false);
  const[showDebug,setShowDebug]=useState(false);
  const[whoopToken,setWhoopToken]=useState(()=>ls('cr_whoop_token',null));
  const[whoopData,setWhoopData]=useState(null);
  const[authLoading,setAuthLoading]=useState(false);
  const[whoopError,setWhoopError]=useState('');
  const cw=startWeek();
  const[tapCount,setTapCount]=useState(0);

  // Handle Whoop OAuth callback - stash code
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const code=params.get('code');
    // Clear stale pending codes older than 5 min
    const ts=parseInt(localStorage.getItem('whoop_code_ts')||'0');
    if(ts&&Date.now()-ts>300000){
      localStorage.removeItem('whoop_pending_code');
      localStorage.removeItem('whoop_code_ts');
    }
    if(code){
      localStorage.setItem('whoop_pending_code',code);
      localStorage.setItem('whoop_code_ts',String(Date.now()));
      window.history.replaceState({},'',window.location.pathname);
      dbg('[W] Code stashed from URL');
    }
  },[]);

  // Process pending code after unlock
  useEffect(()=>{
    if(locked||setupLock)return;
    const code=localStorage.getItem('whoop_pending_code');
    if(!code)return;
    localStorage.removeItem('whoop_pending_code');
    localStorage.removeItem('whoop_code_ts');
    setAuthLoading(true);setWhoopError('');
    dbg('[W] Exchanging code...');
    const t=setTimeout(()=>{setAuthLoading(false);setWhoopError('Timed out - try connecting again.');},15000);
    exchangeCode(code).then(data=>{
      dbg('[W] Response:',data);
      if(data.access_token){
        lss('cr_whoop_token',data.access_token);
        if(data.refresh_token)lss('cr_whoop_refresh',data.refresh_token);
        setWhoopToken(data.access_token);
      }else{setWhoopError('No token received.');}
    }).catch(e=>{setWhoopError(e.message||'Connection failed');dbg('[W] Error:',e.message);})
      .finally(()=>{clearTimeout(t);setAuthLoading(false);});
  },[locked,setupLock]);

  // Fetch Whoop data — cached for 1 hour to minimise proxy requests
  useEffect(()=>{
    if(!whoopToken)return;
    const cached=ls('cr_whoop_cache',null);
    const cacheAge=Date.now()-parseInt(ls('cr_whoop_cache_ts','0'));
    if(cached&&cacheAge<60*60*1000){
      dbg('[W] Using cached data (age: '+Math.round(cacheAge/60000)+' min)');
      setWhoopData(cached);return;
    }
    dbg('[W] Fetching fresh Whoop data...');
    fetchWhoop(whoopToken).then(d=>{
      if(d){
        setWhoopData(d);
        lss('cr_whoop_cache',d);
        lss('cr_whoop_cache_ts',String(Date.now()));
      }
    });
  },[whoopToken]);

  // Service worker
  useEffect(()=>{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/courtready/sw.js',{scope:'/courtready/'}).catch(()=>{});
    }
  },[]);

  // Notification check
  useEffect(()=>{
    function check(){
      if(!('Notification' in window)||Notification.permission!=='granted')return;
      const prefs=ls('cr_notif',{morning:true,wind:true,sun:true});
      const now=new Date();const h=now.getHours();const m=now.getMinutes();
      if(prefs.wind&&h===20&&m>=30&&m<35)new Notification('CourtReady',{body:'Wind down time - screens off in 90 min.',icon:'/courtready/icon-192.png'});
      if(prefs.sun&&now.getDay()===0&&h===18&&m<5)new Notification('CourtReady',{body:'Sunday - build your week for tomorrow.',icon:'/courtready/icon-192.png'});
      if(prefs.morning&&h===7&&m<5)new Notification('CourtReady',{body:'5-minute mobility routine - do it now.',icon:'/courtready/icon-192.png'});
    }
    check();const t=setInterval(check,5*60*1000);return()=>clearInterval(t);
  },[]);

  function disconnectWhoop(){
    ['cr_whoop_token','cr_whoop_refresh','whoop_pending_code','whoop_code_ts','whoop_ver','whoop_st','cr_whoop_cache','cr_whoop_cache_ts'].forEach(k=>localStorage.removeItem(k));
    setWhoopToken(null);setWhoopData(null);setWhoopError('');setAuthLoading(false);
  }

  function handleTitleTap(){
    setTapCount(n=>{
      const next=n+1;
      if(next>=3){setShowDebug(true);return 0;}
      setTimeout(()=>setTapCount(0),1000);
      return next;
    });
  }

  if(locked&&!setupLock)return <LockScreen onUnlock={()=>setLocked(false)}/>;
  if(setupLock)return <LockScreen onUnlock={()=>{setSetupLock(false);setShowSettings(true);}}/>;

  const TABS=[{id:'home',icon:'🏠',label:'Home'},{id:'schedule',icon:'📅',label:'Schedule'},{id:'train',icon:'🎾',label:'Train'},{id:'recovery',icon:'😴',label:'Recovery'},{id:'log',icon:'📊',label:'Log'}];

  return(
    <div className="app">
      {showDebug&&<DebugPanel onClose={()=>setShowDebug(false)}/>}
      {authLoading&&<div style={{position:'fixed',top:0,left:0,right:0,background:'var(--court)',color:'#fff',textAlign:'center',padding:'8px',fontSize:13,fontWeight:600,zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
        <span>Connecting Whoop...</span>
        <button onClick={()=>{setAuthLoading(false);localStorage.removeItem('whoop_pending_code');}} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',padding:'2px 10px',borderRadius:10,fontSize:12,cursor:'pointer'}}>Cancel</button>
      </div>}
      {whoopError&&<div style={{position:'fixed',top:0,left:0,right:0,background:'var(--red)',color:'#fff',textAlign:'center',padding:'8px 12px',fontSize:12,zIndex:999,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>Whoop: {whoopError}</span>
        <button style={{background:'transparent',color:'#fff',fontWeight:700,border:'none',cursor:'pointer'}} onClick={()=>setWhoopError('')}>x</button>
      </div>}
      <div className="hdr">
        <div className="hdr-title" onClick={handleTitleTap}>Court<span>Ready</span></div>
        <div className="hdr-right">
          {whoopData&&whoopData.recovery!=null&&(
            <div className="rchip">
              <div className={'rdot'+(whoopData.recovery>=67?' g':whoopData.recovery>=34?' a':' r')}/>
              <span style={{color:whoopData.recovery>=67?'var(--cline)':whoopData.recovery>=34?'var(--acc)':'var(--red)'}}>{Math.round(whoopData.recovery)}%</span>
            </div>
          )}
          <button className="gear" onClick={()=>setShowSettings(!showSettings)}>⚙</button>
        </div>
      </div>
      <div className="tabs">
        {showSettings
          ?<SettingsTab wConn={!!whoopToken} onDisconn={disconnectWhoop} onConn={initiateWhoopAuth} onSetupLock={()=>setSetupLock(true)}/>
          :tab==='home'?<HomeTab wd={whoopData} wConn={!!whoopToken} onConn={initiateWhoopAuth} cw={cw}/>
          :tab==='schedule'?<ScheduleTab/>
          :tab==='train'?<TrainTab/>
          :tab==='recovery'?<RecoveryTab/>
          :<LogTab/>
        }
      </div>
      <div className="bnav">
        {TABS.map(t=>(
          <button key={t.id} className={'bnav-btn'+(tab===t.id&&!showSettings?' on':'')} onClick={()=>{setTab(t.id);setShowSettings(false);}}>
            <div className="bnav-icon">{t.icon}</div>
            <div className="bnav-lbl">{t.label}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
