<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CourtReady">
<title>CourtReady</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--court:#2D6A4F;--court-l:#40916C;--court-line:#74C69D;--accent:#F4A261;--hot:#E76F51;--ball:#D4E157;--bg:#0D1117;--bg2:#161B22;--surface:#21262D;--surface2:#2D333B;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);--text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;--red:#FF6B6B;--purple:#A78BFA;--r:8px;--rl:14px;--nav:64px;--hdr:52px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Barlow',sans-serif;color:var(--text)}
#root{height:100%;display:flex;flex-direction:column}
button{font-family:'Barlow',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Barlow',sans-serif;outline:none}
.bc{font-family:'Barlow Condensed',sans-serif}
/* LAYOUT */
.app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.hdr{height:var(--hdr);background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:50;position:relative}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--court-line)}
.hdr-title span{color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:8px}
.whoop-chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em}
.whoop-dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.whoop-dot.green{background:var(--court-line)}
.whoop-dot.amber{background:var(--accent)}
.whoop-dot.red{background:var(--red)}
.gear-btn{background:transparent;color:var(--text3);font-size:20px;padding:4px;border-radius:6px}
.gear-btn:hover{color:var(--text);background:var(--surface)}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + 16px)}
.tab-content::-webkit-scrollbar{width:3px}
.tab-content::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
/* BOTTOM NAV */
.bnav{height:var(--nav);background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;align-items:center;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;color:var(--text3);padding:8px 0;border-radius:0;transition:color .15s}
.bnav-btn.on{color:var(--court-line)}
.bnav-icon{font-size:20px;line-height:1}
.bnav-lbl{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
/* SECTION HEADS */
.pg{padding:16px}
.sec-head{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.sec-head:first-child{margin-top:0}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--court-line);white-space:nowrap}
.sec-line{height:1px;flex:1;background:linear-gradient(90deg,var(--court),transparent)}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px}
.card:last-child{margin-bottom:0}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2);line-height:1.5}
/* INFO BOXES */
.info{border-radius:var(--r);padding:10px 14px;font-size:13px;line-height:1.6;margin-bottom:10px}
.info.green{background:rgba(64,145,108,.12);color:var(--court-line);border-left:3px solid var(--court);border-radius:0 var(--r) var(--r) 0}
.info.orange{background:rgba(244,162,97,.1);color:var(--accent);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0}
.info.red{background:rgba(255,107,107,.1);color:var(--red);border-left:3px solid var(--red);border-radius:0 var(--r) var(--r) 0}
/* ROWS */
.row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.rn{color:var(--text)}
.rv{color:var(--text3);font-size:12px;text-align:right}
/* TAGS */
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase;margin-left:5px;vertical-align:middle}
.tg{background:rgba(116,198,157,.15);color:var(--court-line)}
.tp{background:rgba(167,139,250,.15);color:var(--purple)}
.ta{background:rgba(244,162,97,.15);color:var(--accent)}
.tr{background:rgba(255,107,107,.15);color:var(--red)}
.tm{background:rgba(212,225,87,.15);color:var(--ball)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;transition:all .15s}
.btn-primary{background:var(--court);color:#fff}
.btn-primary:hover{background:var(--court-l)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--court-line);color:var(--court-line)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-full{width:100%}
/* SUBNAV */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.snbtn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.snbtn.on{background:var(--court);border-color:var(--court);color:#fff}
/* VIDEO */
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);background:var(--bg2);margin:10px 0}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:var(--r)}
.video-thumb{position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.video-thumb img{width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.play-btn{position:absolute;width:52px;height:52px;background:rgba(0,0,0,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid rgba(255,255,255,.5)}
/* DRILL ACCORDION */
.drill{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:8px;transition:border-color .15s}
.drill.open{border-color:var(--court)}
.drill-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
.drill-hdr:hover{background:var(--surface2)}
.drill-htitle{font-size:14px;font-weight:600;color:var(--text)}
.drill-hmeta{font-size:11px;color:var(--text3);margin-top:2px}
.drill-chev{color:var(--text3);font-size:16px;transition:transform .2s;flex-shrink:0;margin-left:10px}
.drill.open .drill-chev{transform:rotate(180deg)}
.drill-body{border-top:1px solid var(--border);padding:14px;display:none;background:var(--bg2)}
.drill.open .drill-body{display:block}
.step{display:flex;gap:10px;margin-bottom:8px;font-size:13px}
.stepn{min-width:20px;height:20px;border-radius:50%;background:var(--court);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.stept{color:var(--text2);line-height:1.5}
.drill-tip{background:rgba(45,106,79,.15);border-left:3px solid var(--court);border-radius:0 6px 6px 0;padding:9px 12px;font-size:12px;color:var(--court-line);line-height:1.5;margin-top:8px}
/* LOCK SCREEN */
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:32px}
.lock-logo{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:900;text-transform:uppercase;color:var(--court-line);margin-bottom:6px}
.lock-logo span{color:var(--accent)}
.lock-sub{font-size:13px;color:var(--text3);margin-bottom:40px}
.pin-dots{display:flex;gap:12px;margin-bottom:24px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);transition:all .15s}
.pin-dot.filled{background:var(--court-line);border-color:var(--court-line)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px}
.pin-key{height:60px;border-radius:var(--rl);background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pin-key:hover{background:var(--surface2);border-color:var(--court)}
.pin-key:active{background:var(--court);color:#fff}
.pin-key.zero{grid-column:2}
.pin-key.del{background:transparent;border:none;color:var(--text3);font-size:16px}
.bio-btn{margin-top:16px;background:transparent;border:1px solid var(--border2);color:var(--court-line);padding:10px 24px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.bio-btn:hover{border-color:var(--court-line)}
.lock-err{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}
/* HOME TAB */
.whoop-card{background:linear-gradient(135deg,var(--court) 0%,#1a3d2e 100%);border:1px solid rgba(116,198,157,.2);border-radius:var(--rl);padding:16px;margin-bottom:12px}
.whoop-score{font-family:'Barlow Condensed',sans-serif;font-size:64px;font-weight:900;line-height:1;color:#fff}
.whoop-score-lbl{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.whoop-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.whoop-metric{background:rgba(0,0,0,.2);border-radius:var(--r);padding:8px;text-align:center}
.whoop-metric-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff}
.whoop-metric-lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em}
.today-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:12px}
.today-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-family:'Barlow Condensed',sans-serif;font-weight:700;margin-bottom:6px}
.today-block-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--text);text-transform:uppercase;letter-spacing:.02em}
.today-block-desc{font-size:12px;color:var(--text2);margin-top:3px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:var(--court-line)}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.notif-banner{background:rgba(212,225,87,.08);border:1px solid rgba(212,225,87,.2);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.notif-banner-text{font-size:13px;color:var(--ball);flex:1}
/* SCHEDULE */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.week-nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:var(--r);padding:7px 14px;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.05em}
.week-nav-btn:hover{border-color:var(--border2);color:var(--text)}
.week-lbl{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--text);text-transform:uppercase;letter-spacing:.05em}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.day-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 3px;text-align:center;cursor:pointer;transition:all .15s;min-height:72px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day-cell:hover:not(.fixed){border-color:var(--border2)}
.day-cell.fixed{border-color:rgba(231,111,81,.25);background:rgba(231,111,81,.05);cursor:default}
.day-cell.done{border-color:var(--court);background:rgba(45,106,79,.12)}
.day-cell.today-cell{border-color:var(--accent)}
.day-nm{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.day-blk{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text2);text-align:center;line-height:1.2;margin-top:2px}
.day-done-icon{font-size:18px;color:var(--court-line)}
.block-picker{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:12px}
.bpick-day{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.bpick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bpick-opt{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;cursor:pointer;transition:all .15s;text-align:left}
.bpick-opt:hover{border-color:var(--border2)}
.bpick-opt.sel{border-color:var(--court);background:rgba(45,106,79,.12)}
.bpick-letter{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;margin-bottom:1px}
.bpick-name{font-size:11px;color:var(--text2);line-height:1.3}
.rule-list{display:flex;flex-direction:column;gap:6px}
.rule-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.rule-num{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:var(--court);line-height:1;min-width:26px}
.rule-text{font-size:12px;color:var(--text2);line-height:1.5}
.rule-text strong{color:var(--text);font-weight:600}
/* LOG TAB */
.log-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:14px}
.lf-row{margin-bottom:10px}
.lf-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.lf-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:8px 12px;font-size:13px;font-family:'Barlow',sans-serif}
.lf-input:focus{border-color:var(--court-line)}
.lf-select{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:8px 12px;font-size:13px;appearance:none}
.lf-textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:8px 12px;font-size:13px;min-height:70px;resize:none;font-family:'Barlow',sans-serif}
.lf-textarea:focus{border-color:var(--court-line)}
.rating-row{display:flex;gap:6px}
.rating-btn{flex:1;height:36px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);color:var(--text3);font-size:16px;cursor:pointer;transition:all .15s}
.rating-btn.sel{background:var(--court);border-color:var(--court);color:#fff}
.session-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;margin-bottom:8px}
.si-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.si-block{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.si-date{font-size:11px;color:var(--text3)}
.si-notes{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.4}
.si-meta{display:flex;gap:10px;margin-top:6px}
.si-chip{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg2);color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.05em}
/* SETTINGS */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:13px;color:var(--text)}
.settings-sub{font-size:11px;color:var(--text3);margin-top:1px}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--surface2);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--court)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on::after{left:22px}
/* SLEEP CALC */
.sleep-calc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:12px}
.calc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calc-row:last-child{margin-bottom:0}
.calc-lbl{font-size:12px;color:var(--text2);min-width:90px}
.calc-out{background:var(--bg2);border:1px solid var(--court);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.calc-out-val{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--court-line)}
.calc-out-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
/* MILESTONE */
.milestone{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.ms-wk{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;min-width:44px}
.ms-text{font-size:12px;color:var(--text2);line-height:1.5}
.ms-text strong{color:var(--text);font-weight:600}
/* SPORT PROFILE SWITCHER */
.profile-switch{display:flex;gap:6px;margin-bottom:16px}
.profile-btn{flex:1;padding:10px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .15s}
.profile-btn.on{background:var(--court);border-color:var(--court);color:#fff}
/* WHOOP CONNECT */
.whoop-connect{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border:1px solid rgba(255,255,255,.1);border-radius:var(--rl);padding:20px;text-align:center;margin-bottom:12px}
.whoop-connect h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--text);margin-bottom:6px;text-transform:uppercase}
.whoop-connect p{font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.5}
/* RECOVERY SCORE COLORS */
.score-high{color:#74C69D}
.score-med{color:#F4A261}
.score-low{color:#FF6B6B}
/* WEEK PLAN DAYS */
.wp-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:6px}
.wp-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.wp-day-num{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.wp-day-type{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase}
.dt-lower{background:rgba(244,162,97,.15);color:var(--accent)}
.dt-upper{background:rgba(167,139,250,.15);color:var(--purple)}
.dt-hybrid{background:rgba(116,198,157,.15);color:var(--court-line)}
.dt-isolation{background:rgba(255,107,107,.15);color:var(--red)}
.wp-exercises{font-size:12px;color:var(--text2);line-height:1.6}
.wp-equip{font-size:11px;color:var(--text3);margin-top:3px}

const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}};
const lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const todayStr=()=>new Date().toISOString().slice(0,10);
const weekKey=(n)=>`week_${n}`;
const currentWeekNum=()=>{
  const stored=ls('cr_start_week',null);
  if(!stored){const w=1;lss('cr_start_week',{date:todayStr(),num:1});return w;}
  const diff=Math.floor((new Date()-new Date(stored.date))/(7*24*3600*1000));
  return stored.num+diff;
};

async function b64url(arr){
  return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function genVerifier(){
  const a=new Uint8Array(32);crypto.getRandomValues(a);return b64url(a);
}
async function genChallenge(v){
  const enc=new TextEncoder().encode(v);
  const h=await crypto.subtle.digest('SHA-256',enc);
  return b64url(new Uint8Array(h));
}
async function sha256hex(s){
  const enc=new TextEncoder().encode(s);
  const h=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Video card with thumbnail → iframe on tap
function VideoCard({vid,title='Exercise demo'}){
  const[playing,setPlaying]=useState(false);
  if(!vid)return null;
  return(
    <div className="video-wrap">
      {playing?(
        <iframe src={`https://www.youtube.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`}
          allow="autoplay;fullscreen" allowFullScreen title={title}/>
      ):(
        <div className="video-thumb" onClick={()=>setPlaying(true)}>
          <img src={`https://img.youtube.com/vi/${vid}/mqdefault.jpg`} alt={title}
            onError={e=>e.target.style.display='none'}/>
          <div className="play-btn">▶</div>
        </div>
      )}
    </div>
  );
}

// ── LOCK SCREEN ──────────────────────────────────────────
function LockScreen({onUnlock}){
  const[pin,setPin]=useState('');
  const[mode,setMode]=useState('choose'); // choose | pin-setup | pin-auth | bio-auth
  const[err,setErr]=useState('');
  const hasCred=ls('cr_has_pin',false);
  const hasBio=ls('cr_has_bio',false);

  useEffect(()=>{
    if(hasBio){setMode('bio-auth');tryBio();}
    else if(hasCred){setMode('pin-auth');}
    else{setMode('choose');}
  },[]);

  async function tryBio(){
    try{
      const credId=ls('cr_bio_id',null);
      if(!credId){setMode(hasCred?'pin-auth':'choose');return;}
      const challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
      await navigator.credentials.get({publicKey:{
        challenge,rpId:RP_ID,
        allowCredentials:[{id:Uint8Array.from(atob(credId),c=>c.charCodeAt(0)),type:'public-key'}],
        userVerification:'required',timeout:60000
      }});
      onUnlock();
    }catch(e){setMode(hasCred?'pin-auth':'choose');setErr('Biometric failed — enter PIN');}
  }

  async function setupBio(){
    try{
      const challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
      const cred=await navigator.credentials.create({publicKey:{
        challenge,rp:{name:'CourtReady',id:RP_ID},
        user:{id:new TextEncoder().encode('courtready-user'),name:'CourtReady User',displayName:'CourtReady User'},
        pubKeyCredParams:[{alg:-7,type:'public-key'}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
        timeout:60000
      }});
      lss('cr_bio_id',btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
      lss('cr_has_bio',true);
      onUnlock();
    }catch(e){setErr('Biometric setup failed');setMode('choose');}
  }

  async function handlePin(digit){
    const np=pin+digit;
    setPin(np);setErr('');
    if(np.length<4)return;
    const hash=await sha256hex(np);
    if(mode==='pin-setup'){
      lss('cr_pin_hash',hash);lss('cr_has_pin',true);
      setPin('');onUnlock();
    }else{
      const stored=ls('cr_pin_hash','');
      if(hash===stored){setPin('');onUnlock();}
      else{setPin('');setErr('Wrong PIN');}
    }
  }

  const KEYS=['1','2','3','4','5','6','7','8','9','0'];
  return(
    <div className="lock">
      <div className="lock-logo">Court<span>Ready</span></div>
      <div className="lock-sub">Your training, your data, secured.</div>
      {mode==='choose'&&(
        <>
          <p style={{fontSize:13,color:'var(--text2)',textAlign:'center',marginBottom:20,lineHeight:1.5}}>Set up a lock to protect your data</p>
          <div style={{display:'flex',flexDirection:'column',gap:10,width:240}}>
            {window.PublicKeyCredential&&(
              <button className="btn btn-primary btn-full" onClick={setupBio}>Use Fingerprint / Face</button>
            )}
            <button className="btn btn-outline btn-full" onClick={()=>setMode('pin-setup')}>Set up PIN</button>
            <button className="btn btn-outline btn-full" style={{color:'var(--text3)'}} onClick={onUnlock}>Skip for now</button>
          </div>
        </>
      )}
      {(mode==='pin-auth'||mode==='pin-setup')&&(
        <>
          <p style={{fontSize:13,color:'var(--text2)',marginBottom:20}}>{mode==='pin-setup'?'Choose a 4-digit PIN':'Enter your PIN'}</p>
          <div className="pin-dots">
            {[0,1,2,3].map(i=><div key={i} className={`pin-dot${pin.length>i?' filled':''}`}/>)}
          </div>
          <div className="pin-pad">
            {KEYS.map((k,i)=>(
              <button key={k} className={`pin-key${k==='0'?' zero':''}`} onClick={()=>handlePin(k)}>{k}</button>
            ))}
            <button className="pin-key del" onClick={()=>{setPin(p=>p.slice(0,-1));setErr('');}}>⌫</button>
          </div>
          {hasBio&&mode==='pin-auth'&&<button className="bio-btn" onClick={()=>{setMode('bio-auth');tryBio();}}>Use fingerprint</button>}
        </>
      )}
      {mode==='bio-auth'&&(
        <>
          <p style={{fontSize:13,color:'var(--text2)',marginBottom:20}}>Verifying fingerprint…</p>
          <button className="bio-btn" onClick={()=>setMode(hasCred?'pin-auth':'choose')}>Use PIN instead</button>
        </>
      )}
      <div className="lock-err">{err}</div>
    </div>
  );
}

              {done?<div className="day-done-icon">✓</div>:<div className="day-blk">{blk?(blk.id||blk):'—'}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function calcStreak(sessions){
  if(!sessions.length)return 0;
  const weeks=[...new Set(sessions.map(s=>s.week))].sort((a,b)=>b-a);
  const cw=currentWeekNum();
  let streak=0;
  for(let w=cw;w>=1;w--){
    if(weeks.includes(w))streak++;
    else if(w<cw)break;
  }
  return streak;
}

// ── SCHEDULE TAB ─────────────────────────────────────────
function ScheduleTab(){
  const[week,setWeek]=useState(currentWeekNum());
  const[weekData,setWeekData]=useState(()=>ls(weekKey(currentWeekNum()),{}));
  const[picking,setPicking]=useState(null); // day index being assigned
  const isSunday=new Date().getDay()===0;

  useEffect(()=>{setWeekData(ls(weekKey(week),{}));},[week]);

  function assignBlock(dayIdx,block){
    const nd={...weekData,[dayIdx]:{...block,done:false}};
    setWeekData(nd);lss(weekKey(week),nd);setPicking(null);
  }
  function toggleDone(dayIdx){
    if(!weekData[dayIdx])return;
    const nd={...weekData,[dayIdx]:{...weekData[dayIdx],done:!weekData[dayIdx].done}};
    setWeekData(nd);lss(weekKey(week),nd);
  }
  function clearDay(dayIdx){
    const nd={...weekData};delete nd[dayIdx];
    setWeekData(nd);lss(weekKey(week),nd);setPicking(null);
  }

  return(
    <div className="pg">
      {isSunday&&<div className="info orange" style={{marginBottom:12}}>📅 It's Sunday — plan your week below so you're ready for tomorrow.</div>}
      
      <div className="week-nav">
        <button className="week-nav-btn" onClick={()=>{const nw=Math.max(1,week-1);setWeek(nw);}}>← Prev</button>
        <div className="week-lbl">Week {week}</div>
        <button className="week-nav-btn" onClick={()=>setWeek(w=>w+1)}>Next →</button>
      </div>

      <div style={{fontSize:11,color:'var(--text3)',marginBottom:10,lineHeight:1.5}}>Tap a day to assign a block · tap again to mark done · long-press to clear</div>

      <div className="day-grid">
        {DAYS.map((d,i)=>{
          const blk=weekData[i];
          const isFixed=i===3&&blk?.id==='FLAG';
          const done=blk?.done;
          return(
            <div key={d}
              className={`day-cell${i===TODAY_IDX&&week===currentWeekNum()?' today-cell':''}${done?' done':''}${blk?.id==='FLAG'?' fixed':''}`}
              onClick={()=>{if(blk&&blk.done!==undefined)toggleDone(i);else setPicking(i===picking?null:i);}}
              onContextMenu={e=>{e.preventDefault();clearDay(i);}}>
              <div className="day-nm">{d}</div>
              {done?<div className="day-done-icon">✓</div>
               :<div className="day-blk" style={{color:blk?BLOCKS_TENNIS.find(b=>b.id===blk.id)?.color||'var(--text2)':'var(--text3)'}}>
                  {blk?(blk.id||'—'):'—'}
                </div>}
            </div>
          );
        })}
      </div>

      {picking!==null&&(
        <div className="block-picker">
          <div className="bpick-day">Assign — {DAYS[picking]}</div>
          <div className="bpick-grid">
            {BLOCKS_TENNIS.map(b=>(
              <div key={b.id} className={`bpick-opt${weekData[picking]?.id===b.id?' sel':''}`}
                onClick={()=>assignBlock(picking,b)}>
                <div className="bpick-letter" style={{color:b.color}}>{b.id}</div>
                <div className="bpick-name">{b.name}</div>
              </div>
            ))}
            <div className="bpick-opt" onClick={()=>clearDay(picking)}>
              <div className="bpick-letter" style={{color:'var(--text3)'}}>✕</div>
              <div className="bpick-name">Clear day</div>
            </div>
          </div>
        </div>
      )}

      <div className="sec-head"><span className="sec-title">The 5 rules</span><div className="sec-line"/></div>
      <div className="rule-list">
        {RULES.map(r=>(
          <div className="rule-item" key={r.n}>
            <div className="rule-num">{r.n}</div>
            <div className="rule-text">{r.text}</div>
          </div>
        ))}
      </div>
      <div className="info green" style={{marginTop:12}}>Thursday is always flag football. Sunday is always rest. These two never move.</div>
    </div>
  );
}

function RecoveryTab(){

  const[wakeTime,setWakeTime]=useState('06:30');

  function calcBedtime(){
    const dur=dayType==='hard'?8.5:dayType==='moderate'?8:7.5;
    const[h,m]=wakeTime.split(':').map(Number);
    const total=h*60+m-Math.round(dur*60);
    const adj=((total%1440)+1440)%1440;
    const bh=Math.floor(adj/60)%24;
    const bm=adj%60;
    const suf=bh>=12?'pm':'am';
    const dh=bh%12||12;
    const dm=bm<10?'0'+bm:bm;
    return{time:`${dh}:${dm} ${suf}`,dur:`${dur} hrs`};

// ── LOG TAB ──────────────────────────────────────────────
function LogTab(){
  const[sub,setSub]=useState('log');
  const[sessions,setSessions]=useState(()=>ls('cr_sessions',[]));
  const[form,setForm]=useState({date:todayStr(),block:'A',dur:'60',notes:'',rating:0});

  function saveSession(){
    if(!form.block)return;
    const ns={...form,id:Date.now(),week:currentWeekNum()};
    const updated=[ns,...sessions];
    setSessions(updated);lss('cr_sessions',updated);
    setForm({date:todayStr(),block:'A',dur:'60',notes:'',rating:0});
    setSub('history');
  }
  function deleteSession(id){
    const updated=sessions.filter(s=>s.id!==id);
    setSessions(updated);lss('cr_sessions',updated);
  }

  const RATING_EMOJI=['','😫','😕','😐','🙂','💪'];

  return(
    <div className="pg">
      <div className="subnav">
        <button className={`snbtn${sub==='log'?' on':''}`} onClick={()=>setSub('log')}>Log session</button>
        <button className={`snbtn${sub==='history'?' on':''}`} onClick={()=>setSub('history')}>History</button>
      </div>

      {sub==='log'&&(
        <div className="log-form">
          <div className="lf-row">
            <div className="lf-lbl">Date</div>
            <input type="date" className="lf-input" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>

            <div className="lf-lbl">Notes</div>

          </div>
          <div className="lf-row">
            <div className="lf-lbl">How did it feel?</div>
            <div className="rating-row">
              {[1,2,3,4,5].map(r=>(
                <button key={r} className={`rating-btn${form.rating===r?' sel':''}`} onClick={()=>setForm({...form,rating:r})}>{RATING_EMOJI[r]}</button>
              ))}
            </div>

          <button className="btn btn-primary btn-full" style={{marginTop:6}} onClick={saveSession}>Save session</button>
        </div>
      )}

      {sub==='history'&&(
        <>
          {sessions.length===0?(
            <div style={{textAlign:'center',padding:'40px 0',color:'var(--text3)',fontSize:13}}>No sessions logged yet.<br/>Start tracking your training!</div>
          ):sessions.map(s=>(
            <div className="session-item" key={s.id}>
              <div className="si-head">
                <div className="si-block">{BLOCKS_TENNIS.find(b=>b.id===s.block)?.name||s.block}</div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <div className="si-date">{s.date}</div>
                  <button onClick={()=>deleteSession(s.id)} style={{background:'transparent',color:'var(--text3)',fontSize:14,padding:'2px 4px',borderRadius:4}}>✕</button>
                </div>
              </div>
              {s.notes&&<div className="si-notes">{s.notes}</div>}
              <div className="si-meta">
                {s.dur&&<div className="si-chip">{s.dur} min</div>}
                {s.week&&<div className="si-chip">Week {s.week}</div>}
                {s.rating>0&&<div className="si-chip">{['','😫','😕','😐','🙂','💪'][s.rating]}</div>}

// ═══════════════════════════════════════════════════════
// WHOOP OAUTH
// ═══════════════════════════════════════════════════════
async function initiateWhoopAuth(){
  const verifier=await genVerifier();
  const challenge=await genChallenge(verifier);
  const state=btoa(Math.random().toString());
  sessionStorage.setItem('whoop_verifier',verifier);
  sessionStorage.setItem('whoop_state',state);
  const params=new URLSearchParams({
    client_id:WHOOP.clientId,
    redirect_uri:WHOOP.redirectUri,
    response_type:'code',
    scope:WHOOP.scopes,
    code_challenge:challenge,
    code_challenge_method:'S256',
    state
  });
  window.location.href=`${WHOOP.authUrl}?${params}`;
}

async function exchangeWhoopCode(code){
  const verifier=sessionStorage.getItem('whoop_verifier');
  if(!verifier)throw new Error('No code verifier');
  const res=await fetch(WHOOP.tokenUrl,{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'authorization_code',client_id:WHOOP.clientId,code,redirect_uri:WHOOP.redirectUri,code_verifier:verifier})
  });
  if(!res.ok){const t=await res.text();throw new Error(`Token exchange failed: ${t}`);}
  return res.json();
}

async function fetchWhoopData(token){
  try{
    const[rec,slp,cyc]=await Promise.all([
      fetch(`${WHOOP.apiBase}/recovery?limit=1`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null),
      fetch(`${WHOOP.apiBase}/sleep?limit=1`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null),
      fetch(`${WHOOP.apiBase}/cycle?limit=1`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null),
    ]);
    return{
      recovery:rec?.records?.[0]?.score,
      sleep:slp?.records?.[0]?.score,
      strain:cyc?.records?.[0]?.score,
      hrv:rec?.records?.[0]?.score?.hrv_rmssd_milli?.toFixed(0)
    };
  }catch{return null;}
}

// ═══════════════════════════════════════════════════════
// NOTIFICATION SCHEDULER
// ═══════════════════════════════════════════════════════
function scheduleNotifications(prefs){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date();
  const h=now.getHours();const m=now.getMinutes();
  // Wind-down: 8:30pm
  if(prefs.winddown&&h===20&&m>=30&&m<35){
    new Notification('CourtReady',{body:'Wind down time 🌙 Screens off in 90 minutes — bedtime is close.',icon:'/courtready/icon-192.png'});
  }
  // Sunday schedule
  if(prefs.sunday&&now.getDay()===0&&h===18&&m<5){
    new Notification('CourtReady',{body:'📅 Time to build your week — open the Schedule tab.',icon:'/courtready/icon-192.png'});
  }
  // Morning mobility
  if(prefs.morning&&h===7&&m<5){
    new Notification('CourtReady',{body:'🌅 5-minute mobility routine — do it before you check your phone.',icon:'/courtready/icon-192.png'});
  }
}

// ═══════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════
function App(){
  const[locked,setLocked]=useState(()=>ls('cr_has_pin',false)||ls('cr_has_bio',false));
  const[tab,setTab]=useState('home');
  const[showSettings,setShowSettings]=useState(false);
  const[whoopToken,setWhoopToken]=useState(()=>ls('cr_whoop_token',null));
  const[whoopData,setWhoopData]=useState(null);
  const[authLoading,setAuthLoading]=useState(false);
  const currentWeek=currentWeekNum();

  // Handle Whoop OAuth callback
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const code=params.get('code');
    if(code){
      setAuthLoading(true);
      window.history.replaceState({},'',window.location.pathname);
      exchangeWhoopCode(code).then(data=>{
        if(data.access_token){
          lss('cr_whoop_token',data.access_token);
          if(data.refresh_token)lss('cr_whoop_refresh',data.refresh_token);
          setWhoopToken(data.access_token);
        }
      }).catch(e=>console.error('Whoop auth error:',e))
        .finally(()=>setAuthLoading(false));
    }
  },[]);

  // Fetch Whoop data when token available
  useEffect(()=>{
    if(whoopToken){
      fetchWhoopData(whoopToken).then(d=>{if(d)setWhoopData(d);});
    }
  },[whoopToken]);

  // Notification check every 5 min
  useEffect(()=>{
    const prefs=ls('cr_notif',{morning:true,winddown:true,sunday:true});
    scheduleNotifications(prefs);
    const timer=setInterval(()=>scheduleNotifications(ls('cr_notif',{morning:true,winddown:true,sunday:true})),5*60*1000);
    return()=>clearInterval(timer);
  },[]);

  // Service worker
  useEffect(()=>{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/courtready/sw.js',{scope:'/courtready/'}).catch(()=>{});
    }
  },[]);

  function disconnectWhoop(){
    localStorage.removeItem('cr_whoop_token');
    localStorage.removeItem('cr_whoop_refresh');
    setWhoopToken(null);setWhoopData(null);
  }

  if(locked)return<LockScreen onUnlock={()=>setLocked(false)}/>;
  if(authLoading)return<div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center',background:'var(--bg)',flexDirection:'column',gap:12}}><div style={{fontSize:24,color:'var(--court-line)'}}>Connecting Whoop…</div><div style={{fontSize:12,color:'var(--text3)'}}>One moment</div></div>;

  const TABS=[
    {id:'home',icon:'🏠',label:'Home'},
    {id:'schedule',icon:'📅',label:'Schedule'},
    {id:'train',icon:'🎾',label:'Train'},
    {id:'recovery',icon:'😴',label:'Recovery'},
    {id:'log',icon:'📊',label:'Log'},
  ];

  const currentTabName=showSettings?'Settings':TABS.find(t=>t.id===tab)?.label||'';

  return(
    <div className="app">
      <div className="hdr">
        <div className="hdr-title">Court<span>Ready</span></div>
        <div className="hdr-right">
          {whoopData?.recovery!==undefined&&(
            <div className="whoop-chip">
              <div className={`whoop-dot${whoopData.recovery>=67?' green':whoopData.recovery>=34?' amber':' red'}`}/>
              <span style={{color:whoopData.recovery>=67?'var(--court-line)':whoopData.recovery>=34?'var(--accent)':'var(--red)'}}>
                {whoopData.recovery}%
              </span>
            </div>
          )}
          <button className="gear-btn" onClick={()=>setShowSettings(!showSettings)}>⚙</button>
        </div>
      </div>

      <div className="tab-content">
        {showSettings?(
          <SettingsTab whoopConnected={!!whoopToken} onDisconnectWhoop={disconnectWhoop} onConnectWhoop={initiateWhoopAuth}/>
        ):tab==='home'?(
          <HomeTab whoopData={whoopData} whoopConnected={!!whoopToken} onConnectWhoop={initiateWhoopAuth} currentWeek={currentWeek}/>
        ):tab==='schedule'?(
          <ScheduleTab/>
        ):tab==='train'?(
          <TrainTab/>
        ):tab==='recovery'?(
          <RecoveryTab/>
        ):(
          <LogTab/>
        )}
      </div>

      <div className="bnav">
        {TABS.map(t=>(
          <button key={t.id} className={`bnav-btn${tab===t.id&&!showSettings?' on':''}`}
            onClick={()=>{setTab(t.id);setShowSettings(false);}}>
            <div className="bnav-icon">{t.icon}</div>
            <div className="bnav-lbl">{t.label}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
